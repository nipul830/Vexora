<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Submit Payment Details</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      background: #050b1c;
      color: #eef3ff;
    }

    .topbar {
      background: #050b1c;
      border-bottom: 1px solid rgba(139,92,255,.18);
    }

    .logo {
      color: #fff;
      font-size: 32px;
      font-weight: 800;
    }

    .logo span {
      background: linear-gradient(90deg,#9b35ff,#087cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-small {
      text-align: center;
    }

    .hero-small h1 {
      color: #f4f7ff;
    }

    .hero-small p {
      color: #9eacd0;
      line-height: 1.6;
    }

    .card {
      background: #0d1a35;
      border: 1px solid rgba(125,153,220,.25);
      border-radius: 28px;
    }

    label {
      display: block;
      color: #dce6ff;
      font-size: 17px;
      font-weight: 700;
      margin-top: 22px;
      margin-bottom: 9px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 17px 18px;
      border-radius: 18px;
      border: 1px solid rgba(125,153,220,.28);
      background: #050c20;
      color: #fff;
      font-size: 17px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #8b5cff;
      box-shadow: 0 0 0 2px rgba(139,92,255,.15);
    }

    input::placeholder {
      color: #687696;
    }

    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(125,153,220,.28);
      background: #050c20;
      color: #dce6ff;
      font-size: 14px;
    }

    /* ================= UTR GUIDE ================= */

    .utr-guide {
      margin: 8px 0 14px;
    }

    .utr-guide summary {
      display: inline-block;
      color: #a56bff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 0;
    }

    .utr-guide summary:hover {
      color: #2e91ff;
    }

    .utr-guide-text {
      color: #9eacd0;
      font-size: 14px;
      line-height: 1.6;
      margin: 10px 0 12px;
    }

    .utr-guide-text strong {
      color: #fff;
    }

    /* ================= GUIDE IMAGE ================= */

    .utr-image-wrap {
      position: relative;
      margin-top: 12px;
      cursor: pointer;
    }

    .utr-guide-image {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
      margin: auto;
      border-radius: 16px;
      border: 1px solid rgba(139,92,255,.4);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    /* CROSS BUTTON */

    .utr-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;

      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: rgba(0,0,0,.78);
      color: #fff;

      font-size: 18px;
      line-height: 38px;
      text-align: center;

      cursor: pointer;
    }

    .utr-close:active {
      transform: scale(.90);
    }

    /* ================= DOWNLOAD GUIDE ================= */

    .guide-download {
      display: flex;
      justify-content: center;
      margin: 10px auto 18px;
    }

    .guide-download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 12px 18px;

      border-radius: 12px;

      color: #fff;
      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      background: linear-gradient(
        90deg,
        #9b2cff,
        #5b55ff,
        #087cff
      );

      box-shadow: 0 7px 20px rgba(65,70,255,.22);
    }

    .guide-download-btn:active {
      transform: scale(.97);
    }

    /* ================= SUBMIT BUTTON ================= */

    .btn {
      width: 100%;
      border: 0;
      border-radius: 18px;

      padding: 17px 20px;
      margin-top: 25px;

      color: #fff;
      font-size: 17px;
      font-weight: 800;

      cursor: pointer;

      background: linear-gradient(
        90deg,
        #9b2cff,
        #5b55ff,
        #087cff
      );

      box-shadow: 0 8px 25px rgba(65,70,255,.25);
    }

    .btn:active {
      transform: scale(.98);
    }

    @media (max-width: 520px) {

      .logo {
        font-size: 28px;
      }

      .utr-guide-image {
        max-width: 100%;
      }

      .guide-download-btn {
        width: 100%;
      }
    }
  </style>
</head>


<body>

<header class="topbar">
  <div class="logo">
    V<span>exora</span>
  </div>
</header>


<main class="container">

  <section class="hero-small">

    <h1>Submit Payment Details</h1>

    <p>
      Payment complete karne ke baad apni details submit karein.
    </p>

  </section>


  <section class="card">

    <form
      action="/submit-payment"
      method="POST"
      enctype="multipart/form-data"
    >

      <!-- ================= UTR ================= -->

      <label for="transactionId">
        UTR / Transaction ID
      </label>


      <details class="utr-guide">

        <summary>
          How to find UTR?
        </summary>


        <p class="utr-guide-text">
          PhonePe payment complete hone ke baad
          <strong>Transaction Details</strong> me
          <strong>UTR</strong> number dekhein.
          Screenshot me UTR highlighted hai.
        </p>


        <!-- UTR GUIDE IMAGE -->

        <div
          class="utr-image-wrap"
          onclick="closeUtrGuide(event)"
        >

          <button
            type="button"
            class="utr-close"
            onclick="event.stopPropagation(); closeUtrGuide(event)"
          >
            ❌
          </button>


          <img
            src="/assets/utr-guide.jpg"
            alt="How to find UTR in PhonePe"
            class="utr-guide-image"
          >

        </div>


        <!-- DOWNLOAD GUIDE -->

        <div class="guide-download">

          <a
            class="guide-download-btn"
            href="/assets/utr-guide.jpg"
            download="vexora-utr-guide.jpg"
            onclick="event.stopPropagation()"
          >
            ↓ Download Guide
          </a>

        </div>

      </details>


      <!-- UTR INPUT -->

      <input
        id="transactionId"
        type="text"
        name="transactionId"
        placeholder="Enter UTR / Transaction ID"
        inputmode="numeric"
        autocomplete="off"
        required
      >


      <!-- ================= TRADINGVIEW ================= -->

      <label for="tradingview">
        TradingView Username
      </label>

      <input
        id="tradingview"
        type="text"
        name="tradingview"
        placeholder="@username or username"
        required
      >


      <!-- ================= TELEGRAM ================= -->

      <label for="telegram">
        Telegram Username
      </label>

      <input
        id="telegram"
        type="text"
        name="telegram"
        placeholder="@username"
        required
      >


      <!-- ================= PAYMENT PROOF ================= -->

      <label for="proof">
        Payment Proof / Screenshot
      </label>

      <input
        id="proof"
        type="file"
        name="proof"
        accept="image/*"
        required
      >


      <!-- ================= SUBMIT ================= -->

      <button
        class="btn"
        type="submit"
      >
        Submit Payment Details
      </button>


    </form>

  </section>

</main>


<script>

function closeUtrGuide(event) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const guide = document.querySelector(".utr-guide");

  if (guide) {
    guide.removeAttribute("open");
  }
}

</script>

</body>
</html>
