<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Submit Payment Details</title>

  <link rel="stylesheet" href="/styles.css">

  <style>
    body {
      background: #050b1c;
      color: #eef3ff;
    }

    .topbar {
      background: #050b1c;
      border-bottom: 1px solid rgba(139,92,255,.18);
    }

    .logo {
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span {
      background: linear-gradient(90deg,#9b35ff,#087cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-small {
      text-align: center;
    }

    .hero-small h1 {
      color: #f4f7ff;
    }

    .hero-small p {
      color: #9eacd0;
      line-height: 1.6;
    }

    .card {
      background: #0d1a35;
      border: 1px solid rgba(125,153,220,.25);
      border-radius: 28px;
    }

    /* SELECTED PLAN */

    .selected-plan-box {
      margin-bottom: 22px;
      padding: 18px;
      border-radius: 18px;
      background: #071126;
      border: 1px solid rgba(139,92,255,.35);
      text-align: center;
    }

    .selected-plan-label {
      color: #9eacd0;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .selected-plan-name {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
    }

    .selected-plan-amount {
      margin-top: 6px;
      color: #a879ff;
      font-size: 30px;
      font-weight: 800;
    }

    label {
      display: block;
      color: #dce6ff;
      font-size: 17px;
      font-weight: 700;
      margin-top: 22px;
      margin-bottom: 9px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 17px 18px;
      border-radius: 18px;
      border: 1px solid rgba(125,153,220,.28);
      background: #050c20;
      color: #fff;
      font-size: 17px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #8b5cff;
      box-shadow: 0 0 0 2px rgba(139,92,255,.15);
    }

    input::placeholder {
      color: #687696;
    }

    input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(125,153,220,.28);
      background: #050c20;
      color: #dce6ff;
      font-size: 14px;
    }

    /* UTR GUIDE */

    .utr-guide {
      margin: 8px 0 14px;
    }

    .utr-guide summary {
      display: inline-block;
      color: #a56bff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px 0;
    }

    .utr-guide summary:hover {
      color: #2e91ff;
    }

    .utr-guide-text {
      color: #9eacd0;
      font-size: 14px;
      line-height: 1.6;
      margin: 10px 0 12px;
    }

    .utr-guide-text strong {
      color: #fff;
    }

    .utr-image-wrap {
      position: relative;
      margin-top: 12px;
      cursor: pointer;
    }

    .utr-guide-image {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
      margin: auto;
      border-radius: 16px;
      border: 1px solid rgba(139,92,255,.4);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .utr-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,.78);
      color: #fff;
      font-size: 18px;
      line-height: 38px;
      text-align: center;
      cursor: pointer;
    }

    .utr-close:active {
      transform: scale(.90);
    }

    .guide-download {
      display: flex;
      justify-content: center;
      margin: 10px auto 18px;
    }

    .guide-download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(
        90deg,
        #9b2cff,
        #5b55ff,
        #087cff
      );
      box-shadow: 0 7px 20px rgba(65,70,255,.22);
    }

    .guide-download-btn:active {
      transform: scale(.97);
    }

    /* SUBMIT */

    .btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px 20px;
      margin-top: 25px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(
        90deg,
        #9b2cff,
        #5b55ff,
        #087cff
      );
      box-shadow: 0 8px 25px rgba(65,70,255,.25);
    }

    .btn:active {
      transform: scale(.98);
    }

    @media (max-width: 520px) {

      .logo {
        font-size: 28px;
      }

      .utr-guide-image {
        max-width: 100%;
      }

      .guide-download-btn {
        width: 100%;
      }
    }
  </style>
</head>


<body>

<header class="topbar">

  <a href="/" class="logo">
    V<span>exora</span>
  </a>

</header>


<main class="container">

  <section class="hero-small">

    <h1>
      Submit Payment Details
    </h1>

    <p>
      Payment complete karne ke baad apni details submit karein.
    </p>

  </section>


  <section class="card">

    <form
      action="/submit-payment"
      method="POST"
      enctype="multipart/form-data"
    >


      <!-- SELECTED PLAN -->

      <div class="selected-plan-box">

        <div class="selected-plan-label">
          Selected Plan
        </div>

        <div
          id="selectedPlan"
          class="selected-plan-name">
          Loading...
        </div>

        <div
          id="selectedAmount"
          class="selected-plan-amount">
          ₹0
        </div>

      </div>


      <!-- HIDDEN PLAN DATA -->

      <input
        type="hidden"
        name="plan"
        id="planInput"
      >

      <input
        type="hidden"
        name="amount"
        id="amountInput"
      >


      <!-- UTR -->

      <label for="transactionId">
        UTR / Transaction ID
      </label>


      <details class="utr-guide">

        <summary>
          How to find UTR?
        </summary>


        <p class="utr-guide-text">
          PhonePe payment complete hone ke baad
          <strong>Transaction Details</strong> me
          <strong>UTR</strong> number dekhein.
          Screenshot me UTR highlighted hai.
        </p>


        <div
          class="utr-image-wrap"
          onclick="closeUtrGuide(event)"
        >

          <button
            type="button"
            class="utr-close"
            onclick="event.stopPropagation(); closeUtrGuide(event)"
          >
            ❌
          </button>


          <img
            src="/assets/utr-guide.jpg"
            alt="How to find UTR in PhonePe"
            class="utr-guide-image"
          >

        </div>


        <div class="guide-download">

          <a
            class="guide-download-btn"
            href="/assets/utr-guide.jpg"
            download="vexora-utr-guide.jpg"
            onclick="event.stopPropagation()"
          >
            ↓ Download Guide
          </a>

        </div>

      </details>


      <!-- UTR INPUT -->

      <input
        id="transactionId"
        type="text"
        name="transactionId"
        placeholder="Enter UTR / Transaction ID"
        inputmode="numeric"
        autocomplete="off"
        required
      >


      <!-- TRADINGVIEW -->

      <label for="tradingview">
        TradingView Username
      </label>

      <input
        id="tradingview"
        type="text"
        name="tradingview"
        placeholder="@username or username"
        required
      >


      <!-- TELEGRAM -->

      <label for="telegram">
        Telegram Username
      </label>

      <input
        id="telegram"
        type="text"
        name="telegram"
        placeholder="@username"
        required
      >


      <!-- PAYMENT PROOF -->

      <label for="proof">
        Payment Proof / Screenshot
      </label>

      <input
        id="proof"
        type="file"
        name="proof"
        accept="image/*"
        required
      >


      <!-- SUBMIT -->

      <button
        class="btn"
        type="submit"
      >
        Submit Payment Details
      </button>


    </form>

  </section>

</main>


<script>

function closeUtrGuide(event) {

  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const guide =
    document.querySelector(".utr-guide");

  if (guide) {
    guide.removeAttribute("open");
  }
}


/* ================= PLAN + AMOUNT ================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const selectedPlan =
  params.get("plan");


const planData = {

  "7days": {
    name: "7 Days",
    amount: "999"
  },

  "15days": {
    name: "15 Days",
    amount: "1499"
  },

  "30days": {
    name: "30 Days",
    amount: "2499"
  },

  "lifetime": {
    name: "Lifetime",
    amount: "11000"
  }

};


const selected =
  planData[selectedPlan];


if (selected) {

  document.getElementById(
    "selectedPlan"
  ).textContent =
    selected.name;


  document.getElementById(
    "selectedAmount"
  ).textContent =
    "₹" +
    Number(selected.amount)
      .toLocaleString("en-IN");


  document.getElementById(
    "planInput"
  ).value =
    selected.name;


  document.getElementById(
    "amountInput"
  ).value =
    selected.amount;

} else {

  document.getElementById(
    "selectedPlan"
  ).textContent =
    "Plan not selected";


  document.getElementById(
    "selectedAmount"
  ).textContent =
    "₹0";

}

</script>

</body>
</html>
