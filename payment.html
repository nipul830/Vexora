<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Vexora — Payment</title>

<style>

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#050b1d;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

.card {
  width:100%;
  max-width:550px;
  margin:30px auto;
  padding:28px;
  border-radius:24px;
  background:#0d1a36;
  border:1px solid rgba(139,92,255,.35);
}

h1 {
  text-align:center;
}

.plan {
  text-align:center;
  padding:18px;
  border-radius:15px;
  background:#071126;
}

.plan-name {
  font-size:24px;
  font-weight:800;
}

.amount {
  margin-top:8px;
  color:#a879ff;
  font-size:30px;
  font-weight:900;
}

label {
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  color:#aebce0;
  font-weight:700;
}

input,
select {
  width:100%;
  padding:14px;
  border:1px solid #29395b;
  border-radius:12px;
  background:#071126;
  color:#fff;
  outline:none;
}

.qr {
  margin-top:20px;
  text-align:center;
}

.qr img {
  width:220px;
  max-width:100%;
  border-radius:15px;
  background:#fff;
  padding:8px;
}

.method {
  margin-top:18px;
}

.submit {
  width:100%;
  border:0;
  padding:16px;
  margin-top:25px;
  border-radius:14px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  background:linear-gradient(
    135deg,
    #8b2cff,
    #087cff
  );
}

.back {
  display:block;
  margin-top:15px;
  text-align:center;
  color:#9eacd0;
  text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<h1>
Complete Payment
</h1>

<div class="plan">

<div
 id="planName"
 class="plan-name"
>
Loading...
</div>

<div
 id="amount"
 class="amount"
>
₹0
</div>

</div>

<form
 action="/submit-payment"
 method="POST"
 enctype="multipart/form-data"
>

<input
 type="hidden"
 name="plan"
 id="planInput"
>

<label>
Payment Method
</label>

<select
 id="method"
 onchange="changeQR()"
>

<option value="upi">
UPI / PhonePe
</option>

<option value="trc20">
USDT TRC20
</option>

<option value="bep20">
USDT BEP20
</option>

<option value="eth">
ETH / ERC20
</option>

</select>

<div class="qr">

<img
 id="qrImage"
 src="/assets/upi-phonepe.jpg"
 alt="Payment QR"
>

</div>

<label>
UTR / Transaction ID
</label>

<input
 type="text"
 name="transactionId"
 required
 placeholder="Enter UTR / Transaction ID"
>

<label>
TradingView Username
</label>

<input
 type="text"
 name="tradingview"
 placeholder="TradingView username"
>

<label>
Telegram Username
</label>

<input
 type="text"
 name="telegram"
 placeholder="@username"
>

<label>
Payment Proof
</label>

<input
 type="file"
 name="proof"
 accept="image/*"
 required
>

<button
 class="submit"
 type="submit"
>
Submit Payment
</button>

</form>

<a
 class="back"
 href="/plans"
>
← Back to Plans
</a>

</div>

<script>

const params =
new URLSearchParams(
  window.location.search
);

const plan =
params.get("plan") ||
"7days";

const plans = {

  "7days": {
    name:"7 Days",
    amount:999
  },

  "15days": {
    name:"15 Days",
    amount:1499
  },

  "30days": {
    name:"30 Days",
    amount:2499
  },

  "lifetime": {
    name:"Lifetime",
    amount:11000
  }

};

const selected =
plans[plan] ||
plans["7days"];

document.getElementById(
  "planName"
).textContent =
  selected.name;

document.getElementById(
  "amount"
).textContent =
  "₹" +
  selected.amount.toLocaleString(
    "en-IN"
  );

document.getElementById(
  "planInput"
).value =
  plan;

function changeQR() {

  const method =
    document.getElementById(
      "method"
    ).value;

  const qr =
    document.getElementById(
      "qrImage"
    );

  if (
    method === "upi"
  ) {

    qr.src =
      "/assets/upi-phonepe.jpg";

  }

  else if (
    method === "trc20"
  ) {

    qr.src =
      "/assets/usdt-trc20.jpg";

  }

  else if (
    method === "bep20"
  ) {

    qr.src =
      "/assets/usdt-bep20.jpg";

  }

  else if (
    method === "eth"
  ) {

    qr.src =
      "/assets/eth-erc20.jpg";

  }

}

</script>

</body>

</html>
